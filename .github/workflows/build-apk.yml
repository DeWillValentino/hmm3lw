name: Build app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      # The parser/installer tests need the original game installers, which aren't in the repository.
      - name: Run tests
        run: |
          set -o pipefail
          ./gradlew :core:test --console=plain --tests 'com.homm3.livewallpaper.core.heroes.*' --tests 'com.homm3.livewallpaper.core.map.*' --tests 'com.homm3.livewallpaper.core.render.*' 2>&1 | tee build.log

      - name: Build the app
        run: |
          set -o pipefail
          ./gradlew :android:assembleDebug --console=plain 2>&1 | tee -a build.log

      - name: Keep the app file with this run
        uses: actions/upload-artifact@v4
        with:
          name: HMM3-Wandering-Heroes-Live-Wallpaper
          path: android/build/outputs/apk/debug/*.apk

      - name: Publish it as the "Latest build" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/build/outputs/apk/debug/*.apk HMM3-Wandering-Heroes-Live-Wallpaper.apk
          gh release delete latest-build --yes --cleanup-tag || true
          gh release create latest-build HMM3-Wandering-Heroes-Live-Wallpaper.apk \
            --title "Latest build" \
            --notes "Open this page on your phone and tap the .apk file to install. Built from ${GITHUB_SHA::7}."

      # When something fails, keep the build output as a release file so it can be read without Actions access.
      - name: Save the build log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          touch build.log
          find . -path '*/build/test-results/*.xml' -exec grep -l '<failure' {} + 2>/dev/null \
            | xargs -r cat >> build.log || true
          gh release delete build-log --yes --cleanup-tag || true
          gh release create build-log build.log --prerelease --title "Build log (failed build)" \
            --notes "Failed build from ${GITHUB_SHA::7}."

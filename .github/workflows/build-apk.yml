name: Build app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew :core:test

      - name: Build the app
        run: ./gradlew :android:assembleDebug

      - name: Keep the app file with this run
        uses: actions/upload-artifact@v4
        with:
          name: heroes3-wallpaper-wandering-heroes
          path: android/build/outputs/apk/debug/*.apk

      - name: Publish it as the "Latest build" release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/build/outputs/apk/debug/*.apk Heroes3-Wallpaper-wandering-heroes.apk
          gh release delete latest-build --yes --cleanup-tag || true
          gh release create latest-build Heroes3-Wallpaper-wandering-heroes.apk \
            --title "Latest build" \
            --notes "Open this page on your phone and tap the .apk file to install. Built from ${GITHUB_SHA::7}."
